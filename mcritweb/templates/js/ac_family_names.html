<script>
    // The names are fetched as they are typed rather than shipped with the page: mcrit
    // answers "all families" with one storage lookup per family, so every listing that
    // carries an edit modal used to pay for the whole family table whether or not
    // anyone opened one. See issue #77.
    (function () {
        const familyNamesUrl = {{ url_for('explore.family_names')|tojson }};

        function attachFamilyAutocomplete(field) {
            if (!field) {
                return;
            }
            let pending = null;
            let debounce = null;
            const completer = new Autocomplete(field, {
                data: [],
                maximumItems: 5,
                threshold: 1,
                onInput: function (typed) {
                    window.clearTimeout(debounce);
                    if (typed.length < 1) {
                        // the widget's own threshold - it renders nothing below it, so
                        // clearing the field must not cost a round trip
                        return;
                    }
                    debounce = window.setTimeout(function () {
                        if (pending) {
                            // a keystroke has overtaken the answer to the last one
                            pending.abort();
                        }
                        const request = new AbortController();
                        pending = request;
                        fetch(familyNamesUrl + '?q=' + encodeURIComponent(typed), {signal: request.signal})
                            .then(function (response) { return response.ok ? response.json() : {}; })
                            .then(function (data) {
                                if (request !== pending) {
                                    return;
                                }
                                // The items come out of `explore.family_names`, which
                                // builds them with the same `autocomplete_items` the
                                // shipped-with-the-page call site uses as a filter -
                                // autocomplete.js renders a suggestion through
                                // innerHTML and into a data-label attribute, so a
                                // family name is markup there, not text (issue #68).
                                // Building {label, value} here instead would be a
                                // second, unescaped producer.
                                completer.setData(data.autocomplete_items || []);
                            })
                            // an aborted request, an expired session answering with the
                            // login page, an unreachable backend: no suggestions, and the
                            // field stays a plain text input
                            .catch(function () {});
                    }, 150);
                },
            });
        }

        attachFamilyAutocomplete(document.getElementById('sample_family_name'));
        attachFamilyAutocomplete(document.getElementById('family_new_name'));
    })();
</script>
